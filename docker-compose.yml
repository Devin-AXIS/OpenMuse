services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openmuse
      POSTGRES_PASSWORD: openmuse
      POSTGRES_DB: openmuse
    ports:
      - "5433:5432"
    volumes:
      - openmuse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmuse -d openmuse"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  openmuse-postgres:
